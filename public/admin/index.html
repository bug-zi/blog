<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
    }
  </style>
</head>
<body>
  <!-- React root for Decap CMS -->
  <div id="root"></div>

  <!-- Must set MANUAL_INIT BEFORE loading CMS script -->
  <script>
    window.CMS_MANUAL_INIT = true;

    // Make sure root exists
    window.addEventListener('DOMContentLoaded', function() {
      if (!document.getElementById('root')) {
        var root = document.createElement('div');
        root.id = 'root';
        document.body.appendChild(root);
      }
    });
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // 根据环境动态配置 backend
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

    // 本地和生产环境的 GitHub OAuth 配置
    const localConfig = {
      clientId: 'Ov23liaaJJP6JRgGpILx',
      baseUrl: 'http://localhost:3000'
    };

    const prodConfig = {
      clientId: 'Ov23liIqP9q1m4e7TAEk',
      baseUrl: 'https://wiki.debugzi.com'
    };

    const config = isLocal ? localConfig : prodConfig;

    const cmsConfig = {
      backend: {
        name: "github",
        repo: "bug-zi/blog",
        branch: "main",
        base_url: config.baseUrl,
        auth_endpoint: "/api/auth"
      },
      media_folder: "public/images",
      public_folder: "/images",
      locale: "zh_Hans",
      collections: [
        {
          name: "posts",
          label: "文章",
          label_singular: "文章",
          folder: "src/content/posts",
          create: true,
          delete: true,
          extension: "mdx",
          format: "yaml-frontmatter",
          slug: "{{slug}}",
          fields: [
            { label: "标题", name: "title", widget: "string" },
            { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
            { label: "简介", name: "description", widget: "text", required: false },
            { label: "分类", name: "category", widget: "select", required: true, options: [
              { label: "技术", value: "tech" },
              { label: "生活", value: "life" },
              { label: "思考", value: "thoughts" },
              { label: "月刊", value: "monthly" },
              { label: "杂项", value: "misc" },
              { label: "归档", value: "archive" }
            ]},
            { label: "标签", name: "tags", widget: "list", required: false },
            { label: "精选", name: "featured", widget: "boolean", default: false, required: false },
            { label: "正文", name: "body", widget: "markdown" }
          ]
        },
        {
          name: "works",
          label: "作品",
          label_singular: "作品",
          folder: "src/content/works",
          create: true,
          delete: true,
          extension: "mdx",
          format: "yaml-frontmatter",
          slug: "{{slug}}",
          fields: [
            { label: "标题", name: "title", widget: "string" },
            { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
            { label: "简介", name: "description", widget: "text", required: false },
            { label: "分类", name: "category", widget: "select", required: false, options: [
              { label: "软件项目", value: "software" },
              { label: "音乐创作", value: "music" }
            ]},
            { label: "标签", name: "tags", widget: "list", required: false },
            { label: "精选", name: "featured", widget: "boolean", default: false, required: false },
            { label: "封面图", name: "cover", widget: "image", required: false },
            { label: "项目状态", name: "status", widget: "select", required: false, default: "开发中", options: [
              { label: "开发中", value: "开发中" },
              { label: "已上线", value: "已上线" },
              { label: "维护中", value: "维护中" }
            ]},
            { label: "正文", name: "body", widget: "markdown" }
          ]
        },
        {
          name: "stars-website",
          label: "收藏-网站",
          label_singular: "网站",
          folder: "src/content/stars",
          create: true,
          delete: true,
          extension: "mdx",
          format: "yaml-frontmatter",
          slug: "{{slug}}",
          fields: [
            { label: "网站名称", name: "title", widget: "string" },
            { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
            { label: "一句话介绍", name: "description", widget: "text", required: false },
            { label: "网址", name: "link", widget: "string", required: true }
          ]
        },
        {
          name: "stars-tool",
          label: "收藏-工具",
          label_singular: "工具",
          folder: "src/content/stars",
          create: true,
          delete: true,
          extension: "mdx",
          format: "yaml-frontmatter",
          slug: "{{slug}}",
          fields: [
            { label: "工具名称", name: "title", widget: "string" },
            { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
            { label: "一句话介绍", name: "description", widget: "text", required: false },
            { label: "网址", name: "link", widget: "string", required: true }
          ]
        },
        {
          name: "stars-article",
          label: "收藏-文章",
          label_singular: "文章",
          folder: "src/content/stars",
          create: true,
          delete: true,
          extension: "mdx",
          format: "yaml-frontmatter",
          slug: "{{slug}}",
          fields: [
            { label: "文章标题", name: "title", widget: "string" },
            { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
            { label: "一句话介绍", name: "description", widget: "text", required: false },
            { label: "文章链接", name: "link", widget: "string", required: true }
          ]
        },
        {
          name: "stars-music",
          label: "收藏-音乐",
          label_singular: "音乐",
          folder: "src/content/stars",
          create: true,
          delete: true,
          extension: "mdx",
          format: "yaml-frontmatter",
          slug: "{{slug}}",
          fields: [
            { label: "歌名", name: "title", widget: "string" },
            { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
            { label: "歌手名", name: "artist", widget: "string", required: true },
            { label: "发布年份", name: "year", widget: "string", required: true }
          ]
        },
        {
          name: "stars-book",
          label: "收藏-书籍",
          label_singular: "书籍",
          folder: "src/content/stars",
          create: true,
          delete: true,
          extension: "mdx",
          format: "yaml-frontmatter",
          slug: "{{slug}}",
          fields: [
            { label: "书籍名", name: "title", widget: "string" },
            { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
            { label: "作者", name: "author", widget: "string", required: true },
            { label: "发布年份", name: "year", widget: "string", required: true },
            { label: "豆瓣链接", name: "douban_link", widget: "string", required: false }
          ]
        },
        {
          name: "stars-movie",
          label: "收藏-影视",
          label_singular: "影视",
          folder: "src/content/stars",
          create: true,
          delete: true,
          extension: "mdx",
          format: "yaml-frontmatter",
          slug: "{{slug}}",
          fields: [
            { label: "影视作品名", name: "title", widget: "string" },
            { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
            { label: "发布年份", name: "year", widget: "string", required: true },
            { label: "豆瓣链接", name: "douban_link", widget: "string", required: false }
          ]
        },
        {
          name: "sentences",
          label: "一言",
          label_singular: "句子",
          folder: "src/content/sentences",
          create: true,
          delete: true,
          extension: "mdx",
          format: "yaml-frontmatter",
          slug: "{{slug}}",
          fields: [
            { label: "句子内容", name: "title", widget: "string" },
            { label: "添加日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
            { label: "作者/出处", name: "author", widget: "string", required: false },
            { label: "标签", name: "tags", widget: "list", required: false },
            { label: "备注", name: "body", widget: "markdown", required: false }
          ]
        },
        {
          name: "photos",
          label: "照片墙",
          label_singular: "照片",
          folder: "src/content/photos",
          create: true,
          delete: true,
          extension: "mdx",
          format: "yaml-frontmatter",
          slug: "{{slug}}",
          fields: [
            { label: "标题", name: "title", widget: "string" },
            { label: "拍摄日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
            { label: "图片", name: "image", widget: "image" },
            { label: "描述", name: "description", widget: "text", required: false },
            { label: "备注", name: "body", widget: "markdown", required: false }
          ]
        }
      ]
    };

    try {
      CMS.init({ config: cmsConfig });
      console.log('CMS initialized successfully');
    } catch (error) {
      console.error('CMS initialization failed:', error);
      document.body.innerHTML = '<div style="padding:20px;color:red;">CMS 初始化失败: ' + error.message + '</div>';
    }
  </script>
</body>
</html>
