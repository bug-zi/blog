      const description = getField(entry, "description");
      const link = getField(entry, "link");
      const doubanLink = getField(entry, "douban_link");
      const artist = getField(entry, "artist");
      const author = getField(entry, "author");
      const year = getField(entry, "year");
      const subtitle = [artist || author, year].filter(Boolean).join(" · ");
      const url = link || doubanLink;

      return h("div", { className: "cms-preview-shell" },
        h("article", { className: "cms-preview-card cms-preview-star" },
          h("div", { className: "cms-preview-star-icon" }, starIcons[category] || "☆"),
          h("div", null,
            h("p", { className: "cms-preview-eyebrow" }, `收藏 · ${categoryLabels[category] || category}`),
            h("h1", { className: "cms-preview-title" }, title),
            h("div", { className: "cms-preview-meta" },
              date && h("span", { className: "cms-preview-pill" }, formatDate(date)),
              subtitle && h("span", { className: "cms-preview-pill" }, subtitle)
            ),
            description && h("p", { className: "cms-preview-description" }, description),
            url && h("p", { className: "cms-preview-link" }, url)
          )
        )
      );
    };

    const SentencePreview = ({ entry, widgetFor }) => {
      const title = getField(entry, "title", "写下一句话");
      const author = getField(entry, "author");

      return h("div", { className: "cms-preview-shell" },
        h("article", { className: "cms-preview-card" },
          h("p", { className: "cms-preview-eyebrow" }, "一言预览"),
          h("h1", { className: "cms-preview-title" }, title),
          author && h("p", { className: "cms-preview-description" }, `—— ${author}`),
          h("div", { className: "cms-preview-body" }, getBody(widgetFor))
        )
      );
    };

    const PhotoPreview = ({ entry, widgetFor }) => {
      const title = getField(entry, "title", "未命名照片");
      const date = getField(entry, "date");
      const image = getField(entry, "image");
      const description = getField(entry, "description");

      return h("div", { className: "cms-preview-shell" },
        h("article", { className: "cms-preview-card" },
          h("p", { className: "cms-preview-eyebrow" }, "照片预览"),
          h("h1", { className: "cms-preview-title" }, title),
          date && h("div", { className: "cms-preview-meta" }, h("span", { className: "cms-preview-pill" }, formatDate(date))),
          image && h("div", { className: "cms-preview-body" }, h("img", { src: image, alt: title })),
          description && h("p", { className: "cms-preview-description" }, description),
          h("div", { className: "cms-preview-body" }, getBody(widgetFor))
        )
      );
    };

    const FootprintPreview = ({ entry, widgetFor }) => {
      const place = getField(entry, "place", "未命名地点");
      const date = getField(entry, "date");
      const note = getField(entry, "note");

      return h("div", { className: "cms-preview-shell" },
        h("article", { className: "cms-preview-card" },
          h("p", { className: "cms-preview-eyebrow" }, "足迹预览"),
          h("h1", { className: "cms-preview-title" }, place),
          date && h("div", { className: "cms-preview-meta" }, h("span", { className: "cms-preview-pill" }, date)),
          note && h("p", { className: "cms-preview-description" }, note),
          h("div", { className: "cms-preview-body" }, getBody(widgetFor))
        )
      );
    };

    CMS.registerPreviewTemplate("posts", ArticlePreview);
    CMS.registerPreviewTemplate("works", ArticlePreview);
    CMS.registerPreviewTemplate("stars", StarPreview);
    CMS.registerPreviewTemplate("sentences", SentencePreview);
    CMS.registerPreviewTemplate("photos", PhotoPreview);
    CMS.registerPreviewTemplate("footprints", FootprintPreview);
    CMS.registerPreviewTemplate("history", ArticlePreview);
    CMS.registerPreviewTemplate("messages", ArticlePreview);
    CMS.registerPreviewTemplate("archive", ArticlePreview);

    const archiveDeleteCollections = [
      { name: "posts", label: "文章", folder: "src/content/posts" },
      { name: "works", label: "作品", folder: "src/content/works" },
      { name: "stars", label: "收藏", folder: "src/content/stars" },
      { name: "sentences", label: "一言", folder: "src/content/sentences" },
      { name: "photos", label: "照片", folder: "src/content/photos" },
      { name: "footprints", label: "足迹", folder: "src/content/footprints" },
      { name: "history", label: "历史", folder: "src/content/history" }
    ];

    const normalizeArchiveDeleteToken = (value) => {
      if (typeof value !== "string") return "";
      const token = value.trim().replace(/^Bearer\s+/i, "").replace(/^["']|["']$/g, "");
      if (!token || token.includes(" ") || token.startsWith("{") || token.startsWith("[")) return "";
      if (token.length < 30) return "";
      return token;
    };

    const collectArchiveDeleteTokens = (value, tokens = []) => {
      if (!value) return tokens;

      if (typeof value === "string") {
        const token = normalizeArchiveDeleteToken(value);
        if (token) tokens.push(token);
        return tokens;
      }

      if (Array.isArray(value)) {
        value.forEach((item) => collectArchiveDeleteTokens(item, tokens));
        return tokens;
      }

      if (typeof value === "object") {
        Object.entries(value).forEach(([key, item]) => {
          if (/^(token|access_token|oauth_token)$/i.test(key)) {
            collectArchiveDeleteTokens(item, tokens);
          } else if (item && typeof item === "object") {
            collectArchiveDeleteTokens(item, tokens);
          }
        });
      }

      return tokens;
    };

    const getArchiveDeleteTokenCandidates = () => {
      const tokens = [];
      const storages = [localStorage, sessionStorage];

      storages.forEach((storage) => {
        for (let index = 0; index < storage.length; index += 1) {
          const key = storage.key(index);
          if (!key) continue;

          const raw = storage.getItem(key);
          if (!raw) continue;

          try {
            collectArchiveDeleteTokens(JSON.parse(raw), tokens);
          } catch {
            if (/cms|decap|netlify|github|auth|user/i.test(key)) {
              collectArchiveDeleteTokens(raw, tokens);
            }
          }
        }
      });

      return Array.from(new Set(tokens));
    };

    const validateArchiveDeleteToken = async (token) => {
      const response = await fetch("https://api.github.com/user", {
        headers: {
          Accept: "application/vnd.github+json",
          Authorization: `Bearer ${token}`,
          "X-GitHub-Api-Version": "2022-11-28"
        }
      });

      return response.ok;
    };

    const getArchiveDeleteToken = async () => {
      const candidates = getArchiveDeleteTokenCandidates();

      for (const token of candidates) {
        try {
          if (await validateArchiveDeleteToken(token)) return token;
        } catch {
          // Try the next token candidate.
        }
      }

      return "";
    };

    const htmlToMarkdown = (html) => {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const root = doc.body || doc;

      const walk = (node) => {
        if (node.nodeType === Node.TEXT_NODE) {
          return node.textContent.replace(/\s+/g, " ");
        }

        if (node.nodeType !== Node.ELEMENT_NODE) return "";

        const tag = node.tagName.toLowerCase();
        const children = Array.from(node.childNodes).map(walk).join("").trim();

        switch (tag) {
          case "h1":
            return `\n\n# ${children}\n\n`;
          case "h2":
            return `\n\n## ${children}\n\n`;
          case "h3":
            return `\n\n### ${children}\n\n`;
          case "h4":
            return `\n\n#### ${children}\n\n`;
          case "h5":
            return `\n\n##### ${children}\n\n`;
          case "h6":
            return `\n\n###### ${children}\n\n`;
          case "p":
            return `\n\n${children}\n\n`;
          case "br":
            return "\n";
          case "strong":
          case "b":
            return `**${children}**`;
          case "em":
          case "i":
            return `*${children}*`;
          case "blockquote":
            return `\n\n${children.split("\n").map((line) => `> ${line.trim()}`).join("\n")}\n\n`;
          case "code":
            return `\`${children}\``;
          case "pre":
            return `\n\n\`\`\`\n${node.textContent.trim()}\n\`\`\`\n\n`;
          case "a": {
            const href = node.getAttribute("href");
            return href ? `[${children || href}](${href})` : children;
          }
          case "img": {
            const src = node.getAttribute("src");
            const alt = node.getAttribute("alt") || "";
            return src ? `\n\n![${alt}](${src})\n\n` : "";
          }
          case "li":
            return `\n- ${children}`;
          case "ul":
          case "ol":
            return `\n${children}\n\n`;
          case "script":
          case "style":
          case "meta":
          case "link":
            return "";
          default:
            return children;
        }
      };

      return Array.from(root.childNodes)
        .map(walk)
        .join("")
        .replace(/[ \t]+\n/g, "\n")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
    };

    const setNativeValue = (element, value) => {
      const prototype = Object.getPrototypeOf(element);
      const descriptor = Object.getOwnPropertyDescriptor(prototype, "value");
      descriptor?.set?.call(element, value);
      element.dispatchEvent(new Event("input", { bubbles: true }));
      element.dispatchEvent(new Event("change", { bubbles: true }));
    };

    const findBodyTextarea = () => {
      const textareas = Array.from(document.querySelectorAll("textarea"));
      return textareas.find((textarea) => {
        const labelText = textarea.closest("label, div")?.textContent || "";
        const name = textarea.getAttribute("name") || "";
        return name === "body" || /正文|body/i.test(labelText);
      }) || textareas[textareas.length - 1];
    };

    const importDocumentToBody = async (file) => {
      const text = await file.text();
      const extension = file.name.split(".").pop()?.toLowerCase();
      const content = extension === "html" || extension === "htm"
        ? htmlToMarkdown(text)
        : text;
      const textarea = findBodyTextarea();

      if (!textarea) {
        window.alert("未找到正文编辑框，请先打开文章编辑页。");
        return;
      }

      setNativeValue(textarea, content);
    };

    const initDocumentImporter = () => {
      const syncImporter = () => {
        const isPostEditor = /\/collections\/posts\/entries\//.test(window.location.hash || window.location.pathname);
        const existing = document.querySelector(".document-import-panel");

        if (!isPostEditor) {
          existing?.remove();
          return;
        }

        if (existing) return;

        const textarea = findBodyTextarea();
        if (!textarea) return;

        const panel = document.createElement("div");
        panel.className = "document-import-panel";

        const input = document.createElement("input");
        input.type = "file";
        input.accept = ".md,.markdown,.html,.htm,text/markdown,text/html";
        input.hidden = true;

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "导入 MD / HTML";
        button.addEventListener("click", () => input.click());

        const hint = document.createElement("span");
        hint.textContent = "选择 .md、.markdown、.html 或 .htm 文件后会填入正文。";

        input.addEventListener("change", async () => {
          const file = input.files?.[0];
          if (!file) return;

          try {
            await importDocumentToBody(file);
            hint.textContent = `已导入：${file.name}`;
          } catch (error) {
            window.alert(error instanceof Error ? error.message : "导入失败。");
          } finally {
            input.value = "";
          }
        });

        panel.appendChild(input);
        panel.appendChild(button);
        panel.appendChild(hint);
        textarea.insertAdjacentElement("beforebegin", panel);
      };

      window.addEventListener("hashchange", syncImporter);
      new MutationObserver(syncImporter).observe(document.body, { childList: true, subtree: true });
      syncImporter();
    };

    const initArchiveDeletePanel = () => {
      const contextButton = document.getElementById("archiveDeleteContext");
      const toast = document.getElementById("archiveDeleteToast");
      const supportedCollections = archiveDeleteCollections.map((item) => item.name);

      if (!contextButton || !toast) {
        return;
      }

      const setToast = (message, state) => {
        toast.textContent = message;
        toast.hidden = !message;
        toast.classList.toggle("is-error", state === "error");
        toast.classList.toggle("is-success", state === "success");
      };

      const setBusy = (isBusy) => {
        contextButton.disabled = isBusy;
        document.querySelectorAll(".archive-delete-inline").forEach((button) => {
          button.disabled = isBusy;
        });
      };

      const parseEntryFromPath = (path) => {
        const match = path.match(/\/collections\/([^/]+)\/entries\/([^/?#]+)/);
        if (!match) return null;

        const collection = decodeURIComponent(match[1]);
        const slug = decodeURIComponent(match[2]);
        if (!supportedCollections.includes(collection) || !slug) return null;

        return { collection, filename: `${slug}.mdx` };
      };

      const getCurrentEntry = () => parseEntryFromPath(window.location.hash || window.location.pathname);

      const getEntryTitle = (trigger) => {
        const cardText = trigger?.closest("li, article, [role='listitem']")?.textContent?.trim();
        return cardText || getCurrentEntry()?.filename || "当前条目";
      };

      const splitEntrySummary = (link) => {
        const heading = link.querySelector("h2");
        if (!heading || heading.dataset.archiveSplit === "true") return;

        const raw = heading.textContent || "";
        const match = raw.match(/^(.*?)\s+—\s+(\d{4}-\d{2}-\d{2})$/);
        if (!match) return;

        heading.dataset.archiveSplit = "true";
        heading.innerHTML = "";

        const title = document.createElement("span");
        title.className = "archive-delete-title";
        title.textContent = match[1];

        const date = document.createElement("span");
        date.className = "archive-delete-date";
        date.textContent = match[2];

        heading.appendChild(title);
        link.insertAdjacentElement("afterend", date);
      };

      const archiveEntry = async (entry, title) => {
        const token = await getArchiveDeleteToken();

        if (!token) {
          setToast("未找到后台登录令牌，请先完成 GitHub 登录。", "error");
          return;
        }

        if (!entry) {
          setToast("当前页面不是可归档条目。", "error");
          return;
        }

        const confirmed = window.confirm(`确认归档删除「${title}」吗？\n\n归档后内容会移入归档区，原栏目将不再显示；本次功能不提供一键恢复。`);
        if (!confirmed) return;

        setBusy(true);
        setToast("正在归档并删除原文件...", "");

        try {
          const response = await fetch("/api/admin/archive", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              collection: entry.collection,
              filename: entry.filename
            })
          });

          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.error || "归档失败。");
          }

          setToast(`已归档到 ${data.archivedPath}。刷新后台列表后生效。`, "success");
        } catch (error) {
          setToast(error instanceof Error ? error.message : "归档失败。", "error");
        } finally {
          setBusy(false);
        }
      };

      const syncContextButton = () => {
        const entry = getCurrentEntry();
        contextButton.hidden = !entry;
      };

      const injectInlineButtons = () => {
        document.querySelectorAll("a[href*='/collections/'][href*='/entries/']").forEach((link) => {
          const entry = parseEntryFromPath(link.getAttribute("href") || "");
          if (!entry || link.closest(".archive-delete-row") || link.parentElement?.querySelector(".archive-delete-inline")) return;

          const button = document.createElement("button");
          button.className = "archive-delete-action archive-delete-inline";
          button.type = "button";
          button.textContent = "归档";
          button.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            archiveEntry(entry, getEntryTitle(button));
          });

          const row = document.createElement("span");
          row.className = "archive-delete-row";
          link.parentNode.insertBefore(row, link);
          row.appendChild(link);
          splitEntrySummary(link);
          row.appendChild(button);
        });
      };

      contextButton.addEventListener("click", () => {
        archiveEntry(getCurrentEntry(), getEntryTitle(contextButton));
      });

      window.addEventListener("hashchange", syncContextButton);
      new MutationObserver(() => {
        syncContextButton();
        injectInlineButtons();
      }).observe(document.body, { childList: true, subtree: true });

      syncContextButton();
      injectInlineButtons();
    };

    initArchiveDeletePanel();
    initDocumentImporter();

    try {
      CMS.init({ config: cmsConfig });
      console.log('CMS initialized successfully');
    } catch (error) {
      console.error('CMS initialization failed:', error);
      document.body.innerHTML = '<div style="padding:20px;color:red;">CMS 初始化失败: ' + error.message + '</div>';
    }
  </script>
</body>
</html>
